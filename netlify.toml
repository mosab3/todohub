# Netlify configuration
# https://docs.netlify.com/build/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node ^20.19.0 || >=22.12.0. Pin the LTS line so the build
  # does not drift with Netlify's default runtime.
  NODE_VERSION = "22"

# Client-side routes. The app uses react-router-dom (BrowserRouter), so these
# paths must serve the app shell rather than a 404. A newly added route has to
# be listed here too, otherwise a direct visit or reload will 404.
[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

# Everything else is a genuine 404. The previous catch-all served the app shell
# with a 200 for junk URLs, which search engines treat as soft 404s and may
# index as thin pages. public/404.html is served instead, with a real 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Vite writes content-hashed filenames into /assets, so those never change
# under a given URL and can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
